<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F7FA">
  <title>Hier &amp; Jetzt</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <!-- Startseite -->
  <section id="view-start" class="view">
    <div class="start-main">
      <img class="start-logo" src="icons/logo.svg" alt="">
      <h1 class="start-title">Hier &amp; Jetzt</h1>
      <p class="start-sub">Fotos &amp; Videos mit Zeitstempel,<br>GPS und Adresse</p>

      <button id="btn-open-photo" class="menu-btn">
        <span class="menu-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9zm3 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
        </span>
        <span class="menu-text">
          <span class="menu-title">Foto</span>
          <span class="menu-sub">Einzeln oder als Serie</span>
        </span>
        <svg class="menu-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.3 5.3 7.9 6.7 13.2 12l-5.3 5.3 1.4 1.4L16 12z"/></svg>
      </button>

      <button id="btn-open-video" class="menu-btn">
        <span class="menu-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h11a2 2 0 0 1 2 2v2.5l4-3v11l-4-3V17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg>
        </span>
        <span class="menu-text">
          <span class="menu-title">Video</span>
          <span class="menu-sub">Mit Ton, bis 2 Minuten</span>
        </span>
        <svg class="menu-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.3 5.3 7.9 6.7 13.2 12l-5.3 5.3 1.4 1.4L16 12z"/></svg>
      </button>

      <button id="btn-open-compare" class="menu-btn">
        <span class="menu-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v16H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm9-2h2v20h-2zm4 2h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-3v-2h2V6h-2z"/></svg>
        </span>
        <span class="menu-text">
          <span class="menu-title">Vorher / Nachher</span>
          <span class="menu-sub">Vorher aus Galerie, Nachher live</span>
        </span>
        <svg class="menu-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.3 5.3 7.9 6.7 13.2 12l-5.3 5.3 1.4 1.4L16 12z"/></svg>
      </button>
      <input id="before-input" type="file" accept="image/*" hidden>
    </div>

    <div class="start-footer">
      <div class="status-card">
        <div class="status-row">
          <span id="start-dot" class="gps-dot dot-wait"></span>
          <div class="gps-text">
            <div id="start-gps" class="gps-title">GPS wird gesucht …</div>
            <div id="start-addr" class="gps-sub"></div>
          </div>
        </div>
        <div class="status-row">
          <span id="time-dot" class="gps-dot dot-wait"></span>
          <div class="gps-text">
            <div id="time-title" class="gps-title">Uhrzeit wird geprüft …</div>
            <div id="time-sub" class="gps-sub"></div>
          </div>
        </div>
      </div>
      <div id="start-error" class="start-error hidden"></div>
      <button id="start-version" class="start-version">Version 8</button>
    </div>
  </section>

  <!-- Kamera-Ansicht -->
  <section id="view-camera" class="view hidden">
    <video id="video" autoplay playsinline muted></video>
    <img id="ghost" class="ghost hidden" alt="">
    <div id="focus-ring" class="focus-ring hidden"></div>
    <div id="flash" class="flash"></div>

    <div class="status">
      <button id="btn-back" class="glass-btn" aria-label="Zurück zur Startseite">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 4.6 14 3.2 5.2 12l8.8 8.8 1.4-1.4L8 12z"/></svg>
      </button>
      <div class="status-text">
        <div id="gps-chip" class="chip chip-wait">GPS wird gesucht …</div>
        <button id="addr-btn" class="addr-btn" aria-label="Adresse ändern">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
          <span id="addr-line" class="addr"></span>
          <span class="addr-edit">ändern</span>
        </button>
        <button id="note-chip" class="note-chip hidden" aria-label="Notiz ändern">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
          <span id="note-text"></span>
        </button>
      </div>
      <button id="btn-torch" class="glass-btn hidden" aria-label="Taschenlampe">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12v3H6zm0 5h12l-3 5v10H9V12L6 7zm6 7a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg>
      </button>
    </div>

    <div id="cam-message" class="message hidden"></div>

    <div class="controls">
      <div id="compare-banner" class="pill hidden">Nachher-Foto aufnehmen</div>
      <div id="rec-info" class="rec-info hidden"><span class="rec-dot"></span><span id="rec-time">00:00 / 02:00</span></div>
      <div id="zoom-bar" class="zoom-bar hidden"></div>
      <div id="shot-mode" class="segmented hidden">
        <button data-mode="single" class="active">Einzeln</button>
        <button data-mode="series">Serie</button>
      </div>
      <div class="control-row">
        <div class="side">
          <button id="btn-details" class="glass-btn glass-lg" aria-label="Adresse und Notiz">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
          </button>
        </div>
        <button id="btn-shutter" class="shutter" aria-label="Foto aufnehmen" disabled><span class="shutter-inner"></span></button>
        <div class="side">
          <button id="btn-ghost" class="ghost-btn hidden" aria-label="Vorher-Bild ein-/ausblenden">
            <img id="ghost-thumb" alt="">
            <span class="ghost-label">Vorher</span>
          </button>
          <button id="btn-series" class="series-btn hidden" aria-label="Serie abschließen">
            <img id="series-thumb" alt="">
            <span id="series-count" class="series-count">0</span>
            <span class="series-done">Fertig</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Adresse & Notiz -->
  <div id="sheet" class="sheet-backdrop hidden">
    <div id="sheet-panel" class="sheet" role="dialog" aria-label="Adresse und Notiz">
      <div id="sheet-grab" class="sheet-grab">
        <div class="sheet-handle"></div>
        <div class="sheet-head">
          <h2>Adresse &amp; Notiz</h2>
          <button id="sheet-close" class="icon-btn" aria-label="Schließen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 7.1 16.9 5.7 12 10.6 7.1 5.7 5.7 7.1l4.9 4.9-4.9 4.9 1.4 1.4 4.9-4.9 4.9 4.9 1.4-1.4-4.9-4.9z"/></svg>
          </button>
        </div>
      </div>
      <div class="sheet-body">
        <div class="sheet-label">Adresse</div>
        <div id="addr-list"></div>
        <div id="addr-status" class="addr-status"></div>

        <div class="sheet-label">Notiz</div>
        <div class="input-wrap">
          <input id="note-input" class="input" type="text" maxlength="80" autocomplete="off" placeholder="z. B. Treppenhaus gereinigt">
          <button id="note-clear" class="input-clear" aria-label="Notiz löschen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 7.1 16.9 5.7 12 10.6 7.1 5.7 5.7 7.1l4.9 4.9-4.9 4.9 1.4 1.4 4.9-4.9 4.9 4.9 1.4-1.4-4.9-4.9z"/></svg>
          </button>
        </div>
        <div id="note-recent" class="note-recent"></div>
      </div>
      <div class="sheet-foot">
        <button id="sheet-apply" class="btn btn-primary">Übernehmen</button>
      </div>
    </div>
  </div>

  <!-- Verarbeitung -->
  <section id="view-busy" class="view hidden">
    <div class="spinner"></div>
    <p id="busy-text">Foto wird verarbeitet …</p>
  </section>

  <!-- Ergebnis -->
  <section id="view-result" class="view hidden">
    <div class="result-head">
      <span class="result-check">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 16.2-4.2-4.2-1.4 1.4 5.6 5.6 12-12-1.4-1.4z"/></svg>
      </span>
      <span id="result-title">Foto erstellt</span>
    </div>
    <div id="result-single" class="result-image">
      <img id="result-img" alt="Aufgenommenes Foto mit Stempel">
      <video id="result-video" class="hidden" controls playsinline></video>
    </div>
    <div id="result-grid" class="result-grid hidden"></div>
    <div class="result-actions">
      <button id="btn-download" class="btn btn-primary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4h2v9.2l3.3-3.3 1.4 1.4L12 17l-5.7-5.7 1.4-1.4 3.3 3.3zM5 19h14v2H5z"/></svg>
        <span id="download-label">Herunterladen</span>
      </button>
      <button id="btn-share" class="btn hidden">Teilen</button>
      <button id="btn-pdf" class="btn hidden">PDF-Bericht</button>
      <button id="btn-zip" class="btn hidden">Als ZIP</button>
      <button id="btn-new" class="btn">Neues Foto</button>
      <button id="btn-home" class="btn">Startseite</button>
    </div>
  </section>

  <canvas id="canvas" class="hidden"></canvas>
  <script src="exif.js?v=8"></script>
  <script src="export.js?v=8"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
