<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F7FA">
  <title>Hier &amp; Jetzt</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <!-- Startseite -->
  <section id="view-start" class="view">
    <div class="start-main">
      <img class="start-logo" src="icons/logo.svg" alt="">
      <h1 class="start-title">Hier &amp; Jetzt</h1>
      <p class="start-sub">Fotos &amp; Videos mit Zeitstempel,<br>GPS und Adresse</p>

      <button id="btn-open-photo" class="menu-btn menu-btn-primary">
        <span class="menu-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9zm3 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
        </span>
        <span class="menu-text">
          <span class="menu-title">Foto</span>
          <span class="menu-sub">Mit Stempel aufnehmen</span>
        </span>
        <svg class="menu-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.3 5.3 7.9 6.7 13.2 12l-5.3 5.3 1.4 1.4L16 12z"/></svg>
      </button>

      <button id="btn-open-video" class="menu-btn">
        <span class="menu-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h11a2 2 0 0 1 2 2v2.5l4-3v11l-4-3V17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg>
        </span>
        <span class="menu-text">
          <span class="menu-title">Video</span>
          <span class="menu-sub">Mit Ton, bis 2 Minuten</span>
        </span>
        <svg class="menu-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.3 5.3 7.9 6.7 13.2 12l-5.3 5.3 1.4 1.4L16 12z"/></svg>
      </button>
    </div>

    <div class="start-footer">
      <div class="gps-card">
        <span id="start-dot" class="gps-dot dot-wait"></span>
        <div class="gps-text">
          <div id="start-gps" class="gps-title">GPS wird gesucht …</div>
          <div id="start-addr" class="gps-sub"></div>
        </div>
      </div>
      <div id="start-error" class="start-error hidden"></div>
      <div class="start-version">Version 6</div>
    </div>
  </section>

  <!-- Kamera-Ansicht -->
  <section id="view-camera" class="view hidden">
    <video id="video" autoplay playsinline muted></video>

    <div class="status">
      <button id="btn-back" class="glass-btn" aria-label="Zurück zur Startseite">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 4.6 14 3.2 5.2 12l8.8 8.8 1.4-1.4L8 12z"/></svg>
      </button>
      <div class="status-text">
        <div id="gps-chip" class="chip chip-wait">GPS wird gesucht …</div>
        <div id="addr-line" class="addr"></div>
      </div>
    </div>

    <div id="cam-message" class="message hidden"></div>

    <div class="controls">
      <div id="rec-info" class="rec-info hidden"><span class="rec-dot"></span><span id="rec-time">00:00 / 02:00</span></div>
      <button id="btn-shutter" class="shutter" aria-label="Foto aufnehmen" disabled><span class="shutter-inner"></span></button>
    </div>
  </section>

  <!-- Verarbeitung -->
  <section id="view-busy" class="view hidden">
    <div class="spinner"></div>
    <p id="busy-text">Foto wird verarbeitet …</p>
  </section>

  <!-- Ergebnis -->
  <section id="view-result" class="view hidden">
    <div class="result-head">
      <span class="result-check">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 16.2-4.2-4.2-1.4 1.4 5.6 5.6 12-12-1.4-1.4z"/></svg>
      </span>
      <span id="result-title">Foto erstellt</span>
    </div>
    <div class="result-image">
      <img id="result-img" alt="Aufgenommenes Foto mit Stempel">
      <video id="result-video" class="hidden" controls playsinline></video>
    </div>
    <div class="result-actions">
      <button id="btn-download" class="btn btn-primary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4h2v9.2l3.3-3.3 1.4 1.4L12 17l-5.7-5.7 1.4-1.4 3.3 3.3zM5 19h14v2H5z"/></svg>
        Herunterladen
      </button>
      <button id="btn-share" class="btn hidden">Teilen</button>
      <button id="btn-new" class="btn">Neues Foto</button>
      <button id="btn-home" class="btn">Startseite</button>
    </div>
  </section>

  <canvas id="canvas" class="hidden"></canvas>
  <script src="app.js?v=6"></script>
</body>
</html>
